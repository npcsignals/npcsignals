<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#b7c5d3"/></marker></defs><rect width="1200" height="760" fill="#111c29"/><text x="48" y="54" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#71d6be">npcsignals / behind the wrapper</text><text x="48" y="105" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#e8edf2">what a wrapper adds</text><text x="48" y="145" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#b7c5d3">two accounting systems and an operator-controlled connection</text><rect x="70" y="210" width="430" height="130" rx="10" fill="#1b2c3c" stroke="#e5b96c" stroke-dasharray="8 6"/><text x="88" y="242" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e5b96c">native monero</text><text x="88" y="271" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">custody controlled outside hyperliquid</text><text x="88" y="300" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">public reserve balance not established</text><rect x="700" y="210" width="430" height="130" rx="10" fill="#1b2c3c" stroke="#71d6be"/><text x="718" y="242" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#71d6be">hyperliquid token</text><text x="718" y="271" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">public quantities and executions</text><text x="718" y="300" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">token ≠ native monero</text><path d="M500 250 L700 250" fill="none" stroke="#e5b96c" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="540.0" y="238.0" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#b7c5d3">operator credit</text><path d="M700 310 L500 310" fill="none" stroke="#e5b96c" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="540.0" y="298.0" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#b7c5d3">operator payout</text><rect x="150" y="430" width="900" height="150" rx="10" fill="#1b2c3c" stroke="#e5b96c" stroke-dasharray="8 6"/><text x="168" y="462" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e5b96c">the trust boundary</text><text x="168" y="491" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">a public token transfer does not prove a monero reserve or payout.</text><text x="168" y="520" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#e8edf2">an independent attestation needs assets, liabilities and a stated scope.</text><line x1="48" y1="678" x2="1152" y2="678" stroke="#40566a"/><text x="48" y="707" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e5b96c">observed 25 nov 2026 • mixed / labels apply</text><text x="48" y="735" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#b7c5d3">sources: s01; s04; s05; reserves report</text></svg>