<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>the power of ranking</title><desc>a possible feedback loop, not a measured causal effect.; personalization does not imply complete isolation.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="540" rx="8" fill="#101b26"/><text x="40" y="43" font-size="17" fill="#9db5c8" font-weight="normal">npcsignals / conceptual model</text><text x="40" y="92" font-size="34" fill="#e4eaf0" font-weight="bold">the power of ranking</text><rect x="40" y="175" width="200" height="145" rx="8" fill="#24394b"/><text x="54" y="220" font-size="23" fill="#e4eaf0" font-weight="bold">interest</text><text x="54" y="260" font-size="16" fill="#e4eaf0" font-weight="normal">initial signals</text><text x="245" y="250" font-size="22" fill="#9db5c8" font-weight="normal">→</text><rect x="265" y="175" width="200" height="145" rx="8" fill="#24394b"/><text x="279" y="220" font-size="23" fill="#e4eaf0" font-weight="bold">selection</text><text x="279" y="260" font-size="16" fill="#e4eaf0" font-weight="normal">ranked content</text><text x="470" y="250" font-size="22" fill="#9db5c8" font-weight="normal">→</text><rect x="490" y="175" width="200" height="145" rx="8" fill="#24394b"/><text x="504" y="220" font-size="23" fill="#e4eaf0" font-weight="bold">response</text><text x="504" y="260" font-size="16" fill="#e4eaf0" font-weight="normal">new activity</text><text x="695" y="250" font-size="22" fill="#9db5c8" font-weight="normal">→</text><rect x="715" y="175" width="200" height="145" rx="8" fill="#24394b"/><text x="729" y="220" font-size="23" fill="#e4eaf0" font-weight="bold">feedback</text><text x="729" y="260" font-size="16" fill="#e4eaf0" font-weight="normal">updated signals</text><text x="40" y="444" font-size="17" fill="#c2d0dc" font-weight="normal">a possible feedback loop, not a measured causal effect.</text><text x="40" y="469" font-size="17" fill="#c2d0dc" font-weight="normal">personalization does 