<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>the perceived reality</title><desc>assumption: 20% prevalence and fivefold relative visibility.; not observed platform data; visibility is not perceived agreement.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="540" rx="8" fill="#101b26"/><text x="40" y="43" font-size="17" fill="#9db5c8" font-weight="normal">npcsignals / synthetic arithmetic</text><text x="40" y="92" font-size="34" fill="#e4eaf0" font-weight="bold">the perceived reality</text><text x="40" y="160" font-size="22" fill="#e4eaf0" font-weight="normal">underlying prevalence</text><rect x="40" y="175" width="800" height="45" rx="8" fill="#34495b"/><rect x="40" y="175" width="160.0" height="45" rx="8" fill="#d6a45c"/><text x="855" y="207" font-size="22" fill="#e4eaf0" font-weight="normal">20.0%</text><text x="40" y="285" font-size="22" fill="#e4eaf0" font-weight="normal">relative visibility</text><rect x="40" y="300" width="800" height="45" rx="8" fill="#34495b"/><rect x="40" y="300" width="444.44444444444446" height="45" rx="8" fill="#d6a45c"/><text x="855" y="332" font-size="22" fill="#e4eaf0" font-weight="normal">55.6%</text><text x="40" y="444" font-size="17" fill="#c2d0dc" font-weight="normal">assumption: 20% prevalence and fivefold relative visibility.</text><text x="40" y="469" font-size="17" fill="#c2d0dc" font-weight="normal">not observed platform data; visibility is not perceived agreement.</text><text x="40" y="521" font-size="15" fill="#9db5c8" font-weight="normal">synthetic calculation: 100 × p × f / (p × f + 100 − p)</text></g></svg>